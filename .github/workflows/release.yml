name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          # Retry the full install: ffmpeg-static downloads GitHub release assets
          # in its install script, outside npm's registry fetch retry settings.
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit "$status"
            fi
            delay=$((attempt * 15))
            echo "::warning::npm ci failed (attempt $attempt/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Build frontend
        shell: bash
        run: |
          npm run build

      - name: Build package for Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build package for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Spotlight can keep the temporary DMG volume busy during detach.
          sudo mdutil -a -i off
          # Finish DMG creation before starting ZIP compression.
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build package for Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux tar.gz --${{ matrix.arch }} --publish never

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
